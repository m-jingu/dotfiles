#:schema https://yazi-rs.github.io/schemas/yazi.json

# Only settings that differ from yazi's defaults live here; yazi merges them
# over its built-in config, so new defaults from yazi updates still apply.
#
# Plugins are pinned in package.toml, which `ya pkg` rewrites (dropping any
# comments): piper renders Markdown with glow (below), git shows status signs
# (init.lua), vcs-files lists changed files (g v in keymap.toml).

[mgr]
# Column widths (parent, current, preview); default [ 1, 4, 3 ]. A wide
# preview suits the narrow yazi pane in the zellij dev layout.
ratio       = [1, 2, 7]
show_hidden = true   # Dotfiles visible by default (toggle with .)

[plugin]
# Render Markdown with glow (piper plugin, see package.toml)
prepend_previewers = [
	{ url = "*.{md,markdown}", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]
# Git status signs for the git plugin (see init.lua)
prepend_fetchers = [
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
