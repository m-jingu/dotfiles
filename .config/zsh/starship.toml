"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"
right_format = "$time"

[os]
disabled = false
format = "[$symbol](#blue) "

[os.symbols]
Ubuntu     = "󰕈"
Artix      = "󰣇"
Arch       = "󰣇"
CachyOS    = "󰣇"
Macos      = ""
Kali       = ""
RockyLinux = ""
Amazon     = ""

# Fish-style path: every directory but the last is shortened to its first
# letter (~/w/i/terminal-setup). Repo-relative truncation is off so the path
# always reads from ~ or /.
[directory]
format                    = "[$path](cyan)[$read_only]($read_only_style) "
truncation_length         = 1
fish_style_pwd_dir_length = 1
truncate_to_repo          = false

[time]
disabled    = false
format      = "[$time]($style)"
time_format = "%H:%M:%S"
style       = "bright-black"

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
