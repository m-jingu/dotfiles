"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt, shared by macOS and Linux (STARSHIP_CONFIG points here).
# Layout: path, Apple logo or host name, Git, language versions, then ❯; the
# time sits on the right. prompt.zsh collapses accepted lines to "❯ cmd".

add_newline = false   # No blank line between prompts

format = "$directory${custom.apple}$hostname$git_branch$git_status$nodejs$rust$golang$php $character"
right_format = "$time"

# Apple logo on macOS; the host name everywhere else, so a remote shell is
# easy to tell apart. Both sit right after the path, where zjcopy expects them.
[custom.apple]
os     = "macos"
when   = true
symbol = ""
format = "[$symbol](blue) "

# Hidden on macOS by keying on __CF_USER_TEXT_ENCODING, which macOS sets in
# every process (CoreFoundation adds it back even if removed) and Linux lacks.
# detect_env_vars needs one positive entry, hence HOME.
[hostname]
ssh_only        = false
detect_env_vars = ["HOME", "!__CF_USER_TEXT_ENCODING"]
format          = "[$hostname](bold yellow) "

# Fish-style path: every directory but the last is shortened to its first
# letter (~/w/i/terminal-setup). Repo-relative truncation is off so the path
# always reads from ~ or /.
[directory]
format                    = "[$path](cyan)[$read_only]($read_only_style) "
truncation_length         = 1
fish_style_pwd_dir_length = 1
truncate_to_repo          = false

# Clock on the right (right_format)
[time]
disabled    = false
format      = "[$time]($style)"
time_format = "%H:%M:%S"
style       = "bright-black"

# Nerd Font branch icon and the branch name
[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

# Counts of commits ahead/behind and of staged, modified, untracked, deleted
# and conflicted files; each part shows only when non-zero
[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

# Language versions, shown only in directories with matching project files
[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

# Green after success, red after a failed command; ❮ in vi command mode
[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
